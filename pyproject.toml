[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mini-rag"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "aiofiles==25.1",
    "asyncstdlib==3.14",
    "haystack-ai==3.5",
    "numpy==2.5.5",
    "openai==3.60",
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    "pymupdf==2.2",
    "pypdf==7.2",
    "rich==15.0",
    "rich-argparse==1.8",
    "rich-struct[log]",
    "tiktoken==0.14",    
]

[project.optional-dependencies]
dev = ["mypy", "pytest", "pytest-asyncio", "pytest-cov", "ruff", "types-aiofiles"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ["-m", "not live"]
markers = [
    "acceptance: black-box checks for a completed school task",
    "live: tests that make live external requests",
]

[tool.ruff]
src = ["src"]
target-version = "py312"
line-length = 100

[tool.mypy]
mypy_path = ["src"]
python_version = "3.12"
plugins = ["pydantic.mypy"]

[tool.ruff.lint]
ignore = ["PLE1205"]
