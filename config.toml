# mini-rag settings.
# Precedence (highest first): CLI arguments, environment variables, .env,
# this file. Use MINI_RAG_CONFIG=<path> to load a different file.
# Top-level keys are shared by all commands; a command's table overrides them.

data_dir = "data"
tokenizer_model = "text-embedding-3-small"
log_folder = "logs"

[ingest]
manifest = "data/documents.csv"
pdf_dir = "data/pdfs"
output_dir = "index"
chunk_size = 600
chunk_overlap = 90
min_chunk_tokens = 150
# Text blocks to drop (regular expressions); interrupted text around them is glued together.
skip_patterns = [
  '^(Cross-Chapter Box [\w.]+, )?(Box [\w.]+, )?(Figure|Table) [\w.]+ \|',
  '^(Cross-Chapter )?Box [\w.]+ \(continued\)$',
]
# Box titles; a box interrupting the main text moves to the end of its section.
box_pattern = '^(Cross-Chapter )?Box [\w.]+ \|'

[embed]
output_dir = "index"
embedding_model = "text-embedding-3-small"
batch_size = 256

[retrieve]
index_dir = "index"
top_k = 5

[display]
# index_dir defaults to "index"; chunks defaults to the manifest's chunks_path

[ask]
answer_model = "gpt-5.4-mini"
top_k = 5
