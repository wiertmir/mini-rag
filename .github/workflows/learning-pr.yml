name: Learning PR

on:
  push:
    # GitHub issue-created branches start with the issue number.
    branches: ['[0-9]*-*']

permissions:
  contents: read
  issues: read
  pull-requests: write
  actions: write

concurrency:
  group: learning-pr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.event.deleted == false && github.event.sender.type == 'User' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Only trusted automation from the default branch; never run the pushed code here.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v8
        with:
          script: |
            const {syncPullRequest} = require('./.github/scripts/learning-workflow.cjs');
            await syncPullRequest({github, context, core});
