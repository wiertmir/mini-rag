[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mini-rag"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "aiofiles",
    "asyncstdlib",
    "numpy",
    "openai",
    "pydantic",
    "pydantic-settings",
    "pymupdf",
    "pypdf",
    "rich",
    "rich-argparse",
    "rich-struct[log]",
    "tiktoken",
]

[project.optional-dependencies]
dev = ["mypy", "pytest", "pytest-asyncio", "pytest-cov", "ruff", "types-aiofiles"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "acceptance: black-box checks for a completed school task",
]

[tool.ruff]
src = ["src"]
target-version = "py312"
line-length = 100

[tool.mypy]
mypy_path = ["src"]
python_version = "3.12"
plugins = ["pydantic.mypy"]

[tool.ruff.lint]
ignore = ["PLE1205"]
# still reported, but never auto-removed on save
unfixable = ["F401"]
